name: V1 bounded release checks
on:
  pull_request:
  push:
    branches: [main, v0.1, codex/v1-release-ci]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v1-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.16'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
      - name: Validate GitHub workflow syntax and contexts
        run: |
          curl --fail --location --silent --show-error https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - name: Install hashed test closure
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r deploy/v1/test.lock
      - name: Pure safety and package checks (database cases are covered separately)
        run: python -m pytest backend/tests/test_test_safety.py backend/tests/test_v1_runtime_package.py backend/tests/test_v1_release_ci.py -q -ra
      - name: Source and archive determinism
        run: |
          python scripts/v1_runtime_package.py archive --output "$RUNNER_TEMP/context-a.tar"
          python scripts/v1_runtime_package.py archive --output "$RUNNER_TEMP/context-b.tar"
          cmp "$RUNNER_TEMP/context-a.tar" "$RUNNER_TEMP/context-b.tar"
      - name: Maintained JavaScript contracts
        run: |
          node --test frontend/storefront/tests/*.test.mjs backend/tests/browser/v1-client.test.mjs
          npm --prefix frontend/storefront run check
      - name: Maintained browser fixture journeys
        working-directory: frontend/storefront
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
          npm run test:browser
  migrated-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
        env:
          POSTGRES_USER: munimjee_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: munimjee_test_ci
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U munimjee_test -d munimjee_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_LANE: ci
      TEST_DB_RESET: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.16'
      - run: |
          python -m pip install --only-binary=:all: --require-hashes -r deploy/v1/test.lock
      - name: Required actual Alembic and held P01 lease proof
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://munimjee_test:local_test_only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/munimjee_test_ci
        working-directory: backend
        run: |
          python -m pytest tests/test_test_safety.py::test_actual_migrated_schema_and_database_lease -q -ra --junitxml="$RUNNER_TEMP/p01-required.xml"
          python -c 'import os,xml.etree.ElementTree as X; r=X.parse(os.environ["RUNNER_TEMP"]+"/p01-required.xml"); c=r.findall(".//testcase"); assert len(c)==1 and c[0].get("name")=="test_actual_migrated_schema_and_database_lease" and not any(c[0].find(t) is not None for t in ("skipped","failure","error")), "Actual P01 migration gate must pass without skip"'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
      - name: Install locked maintained browser harness
        working-directory: frontend/storefront
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Full backend regression using actual migrations and guarded resets
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://munimjee_test:local_test_only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/munimjee_test_ci
        working-directory: backend
        run: python -m pytest tests -q -ra --junitxml="$RUNNER_TEMP/backend.xml"
      - name: Actual mounted native review, persisted themes and COD journey
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://munimjee_test:local_test_only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/munimjee_test_ci
        working-directory: backend
        run: python -m tests.run_wave4_native_browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: migrated-postgres-results
          path: |
            ${{ runner.temp }}/p01-required.xml
            ${{ runner.temp }}/backend.xml
            artifacts/v1/qa-product/wave4-mounted-browser/result.json
          if-no-files-found: error
          retention-days: 14
  runtime:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.16'
      - name: Build native architecture from immutable base and hashed lock
        run: python scripts/v1_runtime_package.py build --tag "munimjee-v1-runtime:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Offline unprivileged startup and required assets
        run: python scripts/smoke_v1_runtime.py --image "munimjee-v1-runtime:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
