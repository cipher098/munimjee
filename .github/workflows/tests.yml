name: Backend regression tests
on:
  pull_request:
  push:
    branches: [main, v0.1]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: munimjee_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/munimjee_test_ci
      TEST_LANE: ci
      TEST_DB_RESET: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Validate the migrated database and held reset lease
        run: python -m pytest tests/test_test_safety.py -q -ra
      # Every DB fixture resets only the validated disposable lane, then applies
      # actual Alembic head while holding its advisory lease through the test.
      - run: python -m pytest tests -q -ra
      - name: Check browser scripts
        run: |
          node --check static/storefront.js
          node --check static/commerce.js
          node --check static/social.js
