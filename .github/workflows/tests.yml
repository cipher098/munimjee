name: Backend regression tests
on:
  pull_request:
  push:
    branches: [main, v0.1]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: commerce_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/commerce_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/commerce_test
      SECRET_KEY: isolated-ci-placeholder-not-a-production-secret
      META_VERIFY_TOKEN: ci-only
      ANTHROPIC_API_KEY: sk-ant-replay-only-not-a-real-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply all migrations to the disposable database
        run: python -m alembic upgrade head
      - run: python -m pytest tests -q -ra
      - name: Check browser scripts
        run: |
          node --check static/storefront.js
          node --check static/commerce.js
